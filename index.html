 <!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Português Brasileiro – Reise durch Brasilien</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eaf6ec;color:#12301c;min-height:100vh}
#top{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#009c3b,#00b348);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#top b{font-size:17px}
.pill{background:#ffdf00;color:#12301c;border-radius:20px;padding:4px 10px;font-weight:700;font-size:13px;margin-left:6px}
#bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;margin-top:6px}
#bar div{height:100%;background:#ffdf00;width:0;transition:width .4s}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.city{border-radius:18px;padding:16px;margin-bottom:14px;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.city h2{margin:0 0 4px;font-size:22px}
.city p{margin:0;font-size:14px;opacity:.95}
.rio{background:linear-gradient(135deg,#0072bc,#00a8e8)}
.sal{background:linear-gradient(135deg,#e07b00,#ffb300)}
.sao{background:linear-gradient(135deg,#006b2b,#2fa84f)}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.les{background:#fff;border:3px solid #cfe6d4;border-radius:16px;padding:12px;text-align:center;cursor:pointer;font-weight:700;font-size:14px}
.les small{display:block;font-weight:400;color:#4b6a55;margin-top:4px}
.les.done{border-color:#009c3b;background:#e3f6e8}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:#009c3b;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;box-shadow:0 4px 0 #006b2b}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #006b2b}
.btn.blue{background:#002776;box-shadow:0 4px 0 #001549}
.btn.gray{background:#8a9a8e;box-shadow:0 4px 0 #66756a}
.pt{font-size:26px;font-weight:800;color:#002776;margin:6px 0}
.de{font-size:17px;color:#12301c}
.say{font-size:13px;color:#4b6a55;font-style:italic}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:3px solid #cfe6d4;border-radius:14px;background:#fff;font-size:17px;cursor:pointer}
.opt.ok{border-color:#009c3b;background:#e3f6e8}
.opt.no{border-color:#c0392b;background:#fdecea}
.fb{padding:12px;border-radius:12px;margin-top:10px;font-size:15px}
.fb.ok{background:#e3f6e8;color:#0b5a26}
.fb.no{background:#fdecea;color:#8e2a1f}
.info{background:#fff8cc;border-left:6px solid #ffdf00;padding:12px;border-radius:10px;font-size:14px;margin:10px 0}
.step{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#009c3b;font-weight:800}
.big{font-size:48px;text-align:center}
.center{text-align:center}
</style>
</head>
<body>
<div id="top"><b>🇧🇷 Português</b><span><span class="pill" id="lvl">Level 1</span><span class="pill" id="xp">0 XP</span><span class="pill" id="streak">🔥 0</span></span></div>
<div style="padding:0 14px;background:#00b348"><div id="bar"><div id="barfill"></div></div></div>
<main id="app"></main>

<script>
// ===== DATEN: Reise durch Brasilien =====
const CITIES=[
 {id:'rio',cls:'rio',name:'Rio de Janeiro',lvl:'Anfänger',emoji:'🏖️',text:'Copacabana, Zuckerhut und Christusstatue: hier beginnt deine Reise.'},
 {id:'sal',cls:'sal',name:'Salvador da Bahia',lvl:'Mittelstufe',emoji:'🥁',text:'Bunte Altstadt, Musik und Acarajé an jeder Ecke.'},
 {id:'sao',cls:'sao',name:'São Paulo & Amazonas',lvl:'Fortgeschritten',emoji:'🌴',text:'Großstadt-Alltag und Regenwald: lange Gespräche und Slang.'}
];

// Jede Lektion: info (Ort), words [pt,de], erklärung, quiz
const LESSONS=[
 {id:'r1',city:'rio',title:'Oi! Begrüßen',info:'Am Strand von Copacabana grüßt man sich mit "Oi!" und einem Lächeln. Brasilianer sind offen und herzlich.',
  words:[['Oi!','Hallo!'],['Bom dia','Guten Morgen'],['Boa tarde','Guten Tag (nachmittags)'],['Boa noite','Guten Abend / Gute Nacht'],['Tchau!','Tschüss!']],
  explain:'"Bom" heißt gut und wird bei Tageszeiten verwendet. "Oi" ist das normale Hallo im Alltag.',
  quiz:[{q:'Wie grüßt du morgens?',o:['Boa noite','Bom dia','Tchau'],a:1},{q:'Was heißt "Oi!"?',o:['Hallo!','Danke!','Bitte!'],a:0},{q:'Du gehst abends nach Hause. Was sagst du?',o:['Boa tarde','Bom dia','Boa noite'],a:2}]},
 {id:'r2',city:'rio',title:'Wie geht\'s?',info:'"Tudo bem?" hörst du in Rio ständig, auch von Fremden an der Strandbar.',
  words:[['Tudo bem?','Alles gut?'],['Tudo bem!','Ja, alles gut!'],['E você?','Und du?'],['Mais ou menos','Na ja, so lala'],['Beleza','Alles klar / Cool']],
  explain:'Auf "Tudo bem?" antwortest du meist mit "Tudo bem!" und fragst direkt zurück: "E você?".',
  quiz:[{q:'Jemand fragt "Tudo bem?". Was antwortest du?',o:['Tudo bem! E você?','Tchau!','Boa noite'],a:0},{q:'Was bedeutet "Mais ou menos"?',o:['Sehr gut','Na ja, so lala','Bis später'],a:1},{q:'Was heißt "E você?"',o:['Wer bist du?','Und du?','Wo bist du?'],a:1}]},
 {id:'r3',city:'rio',title:'Ich heiße…',info:'Am Zuckerhut lernst du schnell Leute kennen. Vorstellen gehört dazu.',
  words:[['Eu me chamo Marc','Ich heiße Marc'],['Como você se chama?','Wie heißt du?'],['Prazer!','Freut mich!'],['Eu sou alemão','Ich bin Deutscher'],['Eu moro na Alemanha','Ich wohne in Deutschland']],
  explain:'"Eu" ist "ich". "Sou" kommt von "ser" und beschreibt, wer du bist. "Moro" heißt "ich wohne".',
  quiz:[{q:'Wie fragst du nach dem Namen?',o:['Como você se chama?','Tudo bem?','Prazer!'],a:0},{q:'Was sagst du nach dem Vorstellen?',o:['Tchau','Prazer!','Beleza?'],a:1},{q:'"Eu sou alemão" heißt:',o:['Ich spreche Deutsch','Ich bin Deutscher','Ich wohne in Deutschland'],a:1}]},
 {id:'r4',city:'rio',title:'Danke und bitte',info:'In Rio sagt man oft "valeu" im lockeren Gespräch und "obrigado" im höflichen.',
  words:[['Obrigado','Danke (Mann)'],['Obrigada','Danke (Frau)'],['Por favor','Bitte (beim Bitten)'],['De nada','Gern geschehen'],['Desculpa','Entschuldigung']],
  explain:'Ein Mann sagt "obrigado", eine Frau "obrigada". Das passt sich dem Sprecher an, nicht dem Gegenüber.',
  quiz:[{q:'Du bist ein Mann und sagst danke:',o:['Obrigada','Obrigado','De nada'],a:1},{q:'Jemand sagt "Obrigado". Du antwortest:',o:['De nada','Por favor','Oi'],a:0},{q:'Wie entschuldigst du dich?',o:['Desculpa','Tchau','Prazer'],a:0}]},
 {id:'r5',city:'rio',title:'Am Strand bestellen',info:'An der Copacabana bringen Händler dir Água de coco, Sonnencreme und Eis direkt an den Liegestuhl.',
  words:[['Eu quero uma água','Ich möchte ein Wasser'],['Um café, por favor','Einen Kaffee, bitte'],['Quanto custa?','Was kostet das?'],['Aceita cartão?','Nehmen Sie Karte?'],['A conta, por favor','Die Rechnung, bitte']],
  explain:'"Eu quero" heißt "ich möchte". Mit "por favor" am Ende klingt jede Bestellung höflich.',
  quiz:[{q:'Wie bestellst du einen Kaffee?',o:['Um café, por favor','Quanto custa?','Boa noite'],a:0},{q:'Du willst den Preis wissen:',o:['A conta?','Quanto custa?','Tudo bem?'],a:1},{q:'"A conta, por favor" heißt:',o:['Die Karte, bitte','Die Rechnung, bitte','Noch ein Wasser, bitte'],a:1}]},
 {id:'r6',city:'rio',title:'Rettungssätze',info:'Niemand erwartet perfektes Portugiesisch. Mit diesen Sätzen kommst du immer weiter.',
  words:[['Eu não entendo','Ich verstehe nicht'],['Pode repetir?','Kannst du das wiederholen?'],['Fala devagar, por favor','Sprich bitte langsam'],['Eu estou aprendendo','Ich lerne gerade'],['Como se diz…?','Wie sagt man…?']],
  explain:'"Não" steht direkt vor dem Verb. "Estou aprendendo" heißt wortwörtlich "ich bin am Lernen".',
  quiz:[{q:'Du hast nichts verstanden:',o:['Pode repetir?','Prazer!','Beleza'],a:0},{q:'Jemand spricht zu schnell:',o:['Fala devagar, por favor','Tchau','De nada'],a:0},{q:'"Eu não entendo" heißt:',o:['Ich weiß es','Ich verstehe nicht','Ich möchte nicht'],a:1}]},
 {id:'s1',city:'sal',title:'Nach dem Weg fragen',info:'In den Gassen des Pelourinho in Salvador verirrt man sich leicht. Fragen ist hier normal und herzlich.',
  words:[['Onde fica…?','Wo ist…?'],['À direita','Rechts'],['À esquerda','Links'],['Em frente','Geradeaus'],['Fica perto?','Ist es in der Nähe?']],
  explain:'"Fica" bedeutet hier "liegt" oder "befindet sich" und wird oft für Orte benutzt.',
  quiz:[{q:'Wie fragst du nach dem Weg?',o:['Onde fica a igreja?','Quanto custa?','Boa noite'],a:0},{q:'"À esquerda" heißt:',o:['Rechts','Links','Geradeaus'],a:1},{q:'"Em frente" heißt:',o:['Geradeaus','Zurück','Rechts'],a:0}]},
 {id:'s2',city:'sal',title:'Zahlen und Preise',info:'Auf dem Mercado Modelo in Salvador wird gehandelt. Zahlen zu kennen spart Geld.',
  words:[['um, dois, três','eins, zwei, drei'],['quatro, cinco, seis','vier, fünf, sechs'],['sete, oito, nove, dez','sieben, acht, neun, zehn'],['vinte','zwanzig'],['cem','hundert']],
  explain:'"Um" ist männlich, "uma" weiblich: um café, uma água. "Dois" wird zu "duas" bei weiblichen Wörtern.',
  quiz:[{q:'Was ist "cinco"?',o:['3','5','9'],a:1},{q:'Wie heißt "zehn"?',o:['dez','vinte','cem'],a:0},{q:'"cem" ist:',o:['10','20','100'],a:2}]},
 {id:'s3',city:'sal',title:'Gestern, heute, morgen',info:'In Bahia hat man Zeit. Termine sind locker, und "amanhã" ist oft sehr dehnbar.',
  words:[['hoje','heute'],['amanhã','morgen'],['ontem','gestern'],['Eu vou trabalhar amanhã','Ich werde morgen arbeiten'],['Eu fui ao mercado ontem','Ich war gestern auf dem Markt']],
  explain:'Zukunft im Alltag: "vou" + Infinitiv, wie "ich gehe arbeiten". Das ist einfacher als die klassische Zukunftsform.',
  quiz:[{q:'"amanhã" heißt:',o:['gestern','heute','morgen'],a:2},{q:'Wie sagst du "Ich werde essen"?',o:['Eu vou comer','Eu comi','Eu como ontem'],a:0},{q:'"ontem" heißt:',o:['gestern','heute','jetzt'],a:0}]},
 {id:'p1',city:'sao',title:'Slang im Alltag',info:'In São Paulo klingt das Portugiesisch schneller und lockerer. Slang gehört zum Stadtleben.',
  words:[['E aí?','Was geht?'],['Valeu!','Danke! / Bis dann!'],['Tô cansado','Ich bin fertig'],['Bora!','Los geht\'s!'],['Nossa!','Wow!']],
  explain:'"Tô" ist die gesprochene Kurzform von "estou". So sagt man es im Alltag, aber nicht in Briefen.',
  quiz:[{q:'Ein Freund sagt "E aí?". Das bedeutet:',o:['Was geht?','Tschüss','Wie heißt du?'],a:0},{q:'"Bora!" heißt:',o:['Los geht\'s!','Warte!','Nein!'],a:0},{q:'"Tô cansado" heißt:',o:['Ich bin hungrig','Ich bin fertig / müde','Ich bin fröhlich'],a:1}]},
 {id:'p2',city:'sao',title:'Amazonas: Meinungen',info:'Im Amazonas erzählen dir Guides von Flüssen, Tieren und ihrem Leben. Du willst nachfragen und deine Meinung sagen.',
  words:[['Eu acho que…','Ich finde, dass…'],['Eu concordo','Ich stimme zu'],['Eu não concordo','Ich sehe das anders'],['Que lindo!','Wie schön!'],['Eu tenho saudade','Ich vermisse es']],
  explain:'"Achar que" ist die Standardform für "meinen". "Saudade" ist ein berühmtes Wort für tiefe Sehnsucht.',
  quiz:[{q:'Wie sagst du "Ich finde, dass…"?',o:['Eu acho que','Eu vou que','Eu sou que'],a:0},{q:'"Eu concordo" heißt:',o:['Ich stimme zu','Ich gehe','Ich weiß nicht'],a:0},{q:'"Que lindo!" drückt aus:',o:['Bewunderung','Ärger','Müdigkeit'],a:0}]}
];

const XP_PER_LESSON=50, XP_PER_LEVEL=100;

// ===== SPEICHER =====
let S=JSON.parse(localStorage.getItem('pt2')||'{}');
S.done=S.done||{}; S.xp=S.xp||0; S.streak=S.streak||0; S.last=S.last||''; S.placed=S.placed||false;
function save(){localStorage.setItem('pt2',JSON.stringify(S));}
function level(){return Math.floor(S.xp/XP_PER_LEVEL)+1;}
function today(){return new Date().toISOString().slice(0,10);}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}

// ===== SOUND UND SPRACHE =====
let AC;
function tone(f,t,d,when){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.25,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+d);}
function sndOk(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();tone(523,0,.15,0);tone(659,0,.15,.12);tone(784,0,.3,.24);}catch(e){}}
function sndWin(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach((f,i)=>tone(f,0,.35,i*.14));}catch(e){}}
function sndNo(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();tone(220,0,.25,0);}catch(e){}}
function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,''));u.lang='pt-BR';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function esc(s){return s.replace(/'/g,"\\'");}

// ===== KOPFLEISTE =====
function updateTop(){
 document.getElementById('lvl').textContent='Level '+level();
 document.getElementById('xp').textContent=S.xp+' XP';
 document.getElementById('streak').textContent='🔥 '+S.streak;
 document.getElementById('barfill').style.width=((S.xp%XP_PER_LEVEL)/XP_PER_LEVEL*100)+'%';
}

// ===== STARTSEITE: Reise durch Brasilien =====
function home(){
 updateTop();
 const app=document.getElementById('app');
 let h='';
 if(!S.placed){h+=`<div class="card center"><div class="big">👋</div><h2>Willkommen!</h2><p>Du hast schon Grundlagen? Mach den kurzen Einstufungstest, dann schlage ich dir eine Lektion vor. Oder starte einfach in Rio.</p><button class="btn blue" onclick="placement()">Einstufungstest (2 Minuten)</button><button class="btn gray" onclick="S.placed=true;save();home()">Ohne Test starten</button></div>`;}
 CITIES.forEach(c=>{
  const ls=LESSONS.filter(l=>l.city===c.id);
  const n=ls.filter(l=>S.done[l.id]).length;
  h+=`<div class="city ${c.cls}"><h2>${c.emoji} ${c.name}</h2><p><b>${c.lvl}</b> · ${c.text}</p><p style="margin-top:6px">${n} von ${ls.length} Lektionen geschafft</p></div><div class="lessons">`;
  ls.forEach(l=>{h+=`<div class="les ${S.done[l.id]?'done':''}" onclick="startLesson('${l.id}')">${S.done[l.id]?'✅ ':''}${l.title}<small>${S.done[l.id]?'Nochmal üben':'Starten'}</small></div>`;});
  h+='</div>';
 });
 h+=`<div class="card center"><p class="say">Zum Sprechen üben: ruf Claude im Sprachmodus an und sag "Lass uns Portugiesisch sprechen".</p></div>`;
 app.innerHTML=h; window.scrollTo(0,0);
}

// ===== LEKTION: Zeigen, Erklären, Üben =====
let cur=null, step=0, wi=0, qi=0, right=0;
function startLesson(id){cur=LESSONS.find(l=>l.id===id);step=0;wi=0;qi=0;right=0;render();}
function render(){
 const app=document.getElementById('app'),c=CITIES.find(x=>x.id===cur.city);
 if(step===0){
  app.innerHTML=`<div class="city ${c.cls}"><h2>${c.emoji} ${c.name}</h2><p>${cur.title}</p></div><div class="card"><div class="step">Zum Ort</div><div class="info">${cur.info}</div><button class="btn" onclick="step=1;render()">Los geht\'s</button><button class="btn gray" onclick="home()">Zurück zur Karte</button></div>`;
 }else if(step===1){
  const w=cur.words[wi];
  app.innerHTML=`<div class="card center"><div class="step">1 von 3 · Neue Sätze (${wi+1}/${cur.words.length})</div><div class="pt">${w[0]}</div><div class="de">${w[1]}</div><button class="btn blue" onclick="say('${esc(w[0])}')">🔊 Anhören</button><p class="say">Sprich den Satz laut nach, bevor du weitergehst.</p><button class="btn" onclick="nextWord()">${wi<cur.words.length-1?'Weiter':'Weiter zur Erklärung'}</button></div>`;
 }else if(step===2){
  app.innerHTML=`<div class="card"><div class="step">2 von 3 · Warum ist das so?</div><div class="info">${cur.explain}</div>${cur.words.map(w=>`<p><b>${w[0]}</b> – ${w[1]}</p>`).join('')}<button class="btn" onclick="step=3;qi=0;right=0;render()">Jetzt üben</button></div>`;
 }else if(step===3){
  const q=cur.quiz[qi];
  app.innerHTML=`<div class="card"><div class="step">3 von 3 · Üben (${qi+1}/${cur.quiz.length})</div><h3>${q.q}</h3>${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join('')}<div id="fb"></div></div>`;
 }else{finish();}
}
function nextWord(){if(wi<cur.words.length-1){wi++;}else{step=2;}render();}
function pick(i,el){
 const q=cur.quiz[qi];
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');});
 let fb;
 if(i===q.a){right++;sndOk();el.classList.add('ok');fb='<div class="fb ok">Richtig! 🎉</div>';}
 else{sndNo();el.classList.add('no');fb=`<div class="fb no">Nicht ganz. Richtig ist: <b>${q.o[q.a]}</b>. ${cur.explain}</div>`;}
 document.getElementById('fb').innerHTML=fb+`<button class="btn" onclick="qi++;if(qi>=cur.quiz.length){step=4;}render()">Weiter</button>`;
}
function finish(){
 const first=!S.done[cur.id];
 const gained=first?XP_PER_LESSON+right*10:right*5;
 const oldLvl=level();
 S.done[cur.id]=true; S.xp+=gained;
 const t=today();
 if(S.last!==t){S.streak=(S.last===yesterday())?S.streak+1:1;S.last=t;}
 save(); sndWin(); updateTop();
 const up=level()>oldLvl;
 document.getElementById('app').innerHTML=`<div class="card center"><div class="big">${up?'🌟':'🎉'}</div><h2>${up?'Level '+level()+' erreicht!':'Lektion geschafft!'}</h2><p>${right} von ${cur.quiz.length} richtig · <b>+${gained} XP</b></p><p class="say">Tagesserie: 🔥 ${S.streak}</p><button class="btn" onclick="home()">Zurück zur Karte</button><button class="btn gray" onclick="startLesson('${cur.id}')">Lektion wiederholen</button></div>`;
}

// ===== EINSTUFUNGSTEST =====
const PLACE=[
 {q:'Was bedeutet "Bom dia"?',o:['Guten Morgen','Gute Nacht','Danke'],a:0},
 {q:'Wie fragst du: "Wie heißt du?"',o:['Como você se chama?','Onde fica?','Quanto custa?'],a:0},
 {q:'"Eu quero um café, por favor" ist:',o:['eine Bestellung','eine Verabschiedung','eine Frage nach dem Weg'],a:0},
 {q:'Was heißt "À direita"?',o:['Links','Rechts','Geradeaus'],a:1},
 {q:'"Eu vou trabalhar amanhã" bedeutet:',o:['Ich habe gearbeitet','Ich werde morgen arbeiten','Ich arbeite nicht'],a:1},
 {q:'Was bedeutet "Eu acho que…"?',o:['Ich finde, dass…','Ich habe…','Ich gehe…'],a:0}
];
let pi=0,pr=0;
function placement(){pi=0;pr=0;placeQ();}
function placeQ(){
 const q=PLACE[pi];
 document.getElementById('app').innerHTML=`<div class="card"><div class="step">Einstufungstest ${pi+1}/${PLACE.length}</div><h3>${q.q}</h3>${q.o.map((o,i)=>`<button class="opt" onclick="placePick(${i})">${o}</button>`).join('')}<button class="btn gray" onclick="placePick(-1)">Weiß ich noch nicht</button></div>`;
}
function placePick(i){
 if(i===PLACE[pi].a)pr++;
 pi++;
 if(pi<PLACE.length){placeQ();return;}
 S.placed=true;save();
 let rec,txt;
 if(pr<=2){rec='r1';txt='Du startest am besten ganz vorne, in Rio mit "Oi! Begrüßen".';}
 else if(pr<=4){rec='r5';txt='Du hast schon Grundlagen. Probier "Am Strand bestellen" in Rio, die früheren Lektionen kannst du zum Auffrischen nachholen.';}
 else{rec='s1';txt='Sehr gut! Du kannst direkt in Salvador mit "Nach dem Weg fragen" weitermachen.';}
 document.getElementById('app').innerHTML=`<div class="card center"><div class="big">🎯</div><h2>${pr} von ${PLACE.length} richtig</h2><p>${txt}</p><button class="btn" onclick="startLesson('${rec}')">Empfohlene Lektion starten</button><button class="btn gray" onclick="home()">Zur Karte</button></div>`;
}

home();
</script>
</body>
</html>
