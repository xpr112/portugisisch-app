<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Português Brasileiro</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eaf6ec;color:#12301c;min-height:100vh}
#top{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#009c3b,#00b348);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#top b{font-size:17px;cursor:pointer}
.pill{background:#ffdf00;color:#12301c;border-radius:20px;padding:4px 10px;font-weight:700;font-size:13px;margin-left:6px}
#barwrap{padding:0 14px 6px;background:#00b348}
#bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
#barfill{height:100%;background:#ffdf00;width:0;transition:width .4s}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;min-height:170px;color:#fff;background:linear-gradient(135deg,#009c3b,#ffdf00 60%,#002776);background-size:cover;background-position:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.65))}
.hero .txt{position:relative;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;min-height:170px}
.hero h2{margin:0 0 4px;font-size:24px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.hero p{margin:0;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.credit{font-size:10px;opacity:.8;margin-top:6px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mi{position:relative;border-radius:18px;overflow:hidden;min-height:130px;color:#fff;cursor:pointer;background-size:cover;background-position:center;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.mi .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.7))}
.mi .txt{position:relative;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:130px}
.mi b{font-size:17px;text-shadow:0 2px 5px rgba(0,0,0,.7)}
.mi small{font-size:12px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.g1{background-color:#009c3b}.g2{background-color:#e07b00}.g3{background-color:#002776}.g4{background-color:#6a1b9a}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.les{background:#fff;border:3px solid #cfe6d4;border-radius:16px;padding:12px;text-align:center;cursor:pointer;font-weight:700;font-size:14px}
.les small{display:block;font-weight:400;color:#4b6a55;margin-top:4px}
.les.done{border-color:#009c3b;background:#e3f6e8}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:#009c3b;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;box-shadow:0 4px 0 #006b2b}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #006b2b}
.btn.blue{background:#002776;box-shadow:0 4px 0 #001549}
.btn.gray{background:#8a9a8e;box-shadow:0 4px 0 #66756a}
.btn.red{background:#c0392b;box-shadow:0 4px 0 #8e2a1f}
.row{display:flex;gap:10px}.row .btn{flex:1}
.pt{font-size:26px;font-weight:800;color:#002776;margin:6px 0}
.de{font-size:17px}
.say{font-size:13px;color:#4b6a55;font-style:italic}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:3px solid #cfe6d4;border-radius:14px;background:#fff;font-size:17px;cursor:pointer}
.opt.ok{border-color:#009c3b;background:#e3f6e8}
.opt.no{border-color:#c0392b;background:#fdecea}
.fb{padding:12px;border-radius:12px;margin-top:10px;font-size:15px}
.fb.ok{background:#e3f6e8;color:#0b5a26}
.fb.no{background:#fdecea;color:#8e2a1f}
.info{background:#fff8cc;border-left:6px solid #ffdf00;padding:12px;border-radius:10px;font-size:14px;margin:10px 0}
.step{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#009c3b;font-weight:800}
.big{font-size:48px;text-align:center}
.center{text-align:center}
.chip{display:inline-block;background:#e3f6e8;color:#0b5a26;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
.photo{height:150px;border-radius:14px;background-size:cover;background-position:center;background-color:#cfe6d4;margin:10px 0}
</style>
</head>
<body>

const LESSONS=[
 {id:'r1',city:'rio',title:'Oi! Begrüßen',info:'Am Strand von Copacabana grüßt man sich mit "Oi!" und einem Lächeln. Brasilianer sind offen und herzlich.',words:[['Oi!','Hallo!'],['Bom dia','Guten Morgen'],['Boa tarde','Guten Tag (nachmittags)'],['Boa noite','Guten Abend / Gute Nacht'],['Tchau!','Tschüss!']],explain:'"Bom" heißt gut und wird bei Tageszeiten verwendet. "Oi" ist das normale Hallo im Alltag.',quiz:[{q:'Wie grüßt du morgens?',o:['Boa noite','Bom dia','Tchau'],a:1},{q:'Was heißt "Oi!"?',o:['Hallo!','Danke!','Bitte!'],a:0},{q:'Du gehst abends nach Hause. Was sagst du?',o:['Boa tarde','Bom dia','Boa noite'],a:2}]},
 {id:'r2',city:'rio',title:'Wie geht\'s?',info:'"Tudo bem?" hörst du in Rio ständig, auch von Fremden an der Strandbar.',words:[['Tudo bem?','Alles gut?'],['Tudo bem!','Ja, alles gut!'],['E você?','Und du?'],['Mais ou menos','Na ja, so lala'],['Beleza','Alles klar / Cool']],explain:'Auf "Tudo bem?" antwortest du meist mit "Tudo bem!" und fragst direkt zurück: "E você?".',quiz:[{q:'Jemand fragt "Tudo bem?". Was antwortest du?',o:['Tudo bem! E você?','Tchau!','Boa noite'],a:0},{q:'Was bedeutet "Mais ou menos"?',o:['Sehr gut','Na ja, so lala','Bis später'],a:1},{q:'Was heißt "E você?"',o:['Wer bist du?','Und du?','Wo bist du?'],a:1}]},
 {id:'r3',city:'rio',title:'Ich heiße…',info:'Am Zuckerhut lernst du schnell Leute kennen. Vorstellen gehört dazu.',words:[['Eu me chamo Marc','Ich heiße Marc'],['Como você se chama?','Wie heißt du?'],['Prazer!','Freut mich!'],['Eu sou alemão','Ich bin Deutscher'],['Eu moro na Alemanha','Ich wohne in Deutschland']],explain:'"Eu" ist "ich". "Sou" kommt von "ser" und beschreibt, wer du bist. "Moro" heißt "ich wohne".',quiz:[{q:'Wie fragst du nach dem Namen?',o:['Como você se chama?','Tudo bem?','Prazer!'],a:0},{q:'Was sagst du nach dem Vorstellen?',o:['Tchau','Prazer!','Beleza?'],a:1},{q:'"Eu sou alemão" heißt:',o:['Ich spreche Deutsch','Ich bin Deutscher','Ich wohne in Deutschland'],a:1}]},
 {id:'r4',city:'rio',title:'Danke und bitte',info:'In Rio sagt man oft "valeu" im lockeren Gespräch und "obrigado" im höflichen.',words:[['Obrigado','Danke (Mann)'],['Obrigada','Danke (Frau)'],['Por favor','Bitte (beim Bitten)'],['De nada','Gern geschehen'],['Desculpa','Entschuldigung']],explain:'Ein Mann sagt "obrigado", eine Frau "obrigada". Das richtet sich nach dem Sprecher, nicht nach dem Gegenüber.',quiz:[{q:'Du bist ein Mann und sagst danke:',o:['Obrigada','Obrigado','De nada'],a:1},{q:'Jemand sagt "Obrigado". Du antwortest:',o:['De nada','Por favor','Oi'],a:0},{q:'Wie entschuldigst du dich?',o:['Desculpa','Tchau','Prazer'],a:0}]},
 {id:'r5',city:'rio',title:'Am Strand bestellen',info:'An der Copacabana bringen Händler dir Água de coco und Eis direkt an den Liegestuhl.',words:[['Eu quero uma água','Ich möchte ein Wasser'],['Um café, por favor','Einen Kaffee, bitte'],['Quanto custa?','Was kostet das?'],['Aceita cartão?','Nehmen Sie Karte?'],['A conta, por favor','Die Rechnung, bitte']],explain:'"Eu quero" heißt "ich möchte". Mit "por favor" am Ende klingt jede Bestellung höflich.',quiz:[{q:'Wie bestellst du einen Kaffee?',o:['Um café, por favor','Quanto custa?','Boa noite'],a:0},{q:'Du willst den Preis wissen:',o:['A conta?','Quanto custa?','Tudo bem?'],a:1},{q:'"A conta, por favor" heißt:',o:['Die Karte, bitte','Die Rechnung, bitte','Noch ein Wasser, bitte'],a:1}]},
 {id:'r6',city:'rio',title:'Rettungssätze',info:'Niemand erwartet perfektes Portugiesisch. Mit diesen Sätzen kommst du immer weiter.',words:[['Eu não entendo','Ich verstehe nicht'],['Pode repetir?','Kannst du das wiederholen?'],['Fala devagar, por favor','Sprich bitte langsam'],['Eu estou aprendendo','Ich lerne gerade'],['Como se diz…?','Wie sagt man…?']],explain:'"Não" steht direkt vor dem Verb. "Estou aprendendo" heißt wortwörtlich "ich bin am Lernen".',quiz:[{q:'Du hast nichts verstanden:',o:['Pode repetir?','Prazer!','Beleza'],a:0},{q:'Jemand spricht zu schnell:',o:['Fala devagar, por favor','Tchau','De nada'],a:0},{q:'"Eu não entendo" heißt:',o:['Ich weiß es','Ich verstehe nicht','Ich möchte nicht'],a:1}]},
 {id:'s1',city:'sal',title:'Nach dem Weg fragen',info:'In den Gassen des Pelourinho in Salvador verirrt man sich leicht. Fragen ist hier normal und herzlich.',words:[['Onde fica…?','Wo ist…?'],['À direita','Rechts'],['À esquerda','Links'],['Em frente','Geradeaus'],['Fica perto?','Ist es in der Nähe?']],explain:'"Fica" bedeutet hier "liegt" oder "befindet sich" und wird oft für Orte benutzt.',quiz:[{q:'Wie fragst du nach dem Weg?',o:['Onde fica a igreja?','Quanto custa?','Boa noite'],a:0},{q:'"À esquerda" heißt:',o:['Rechts','Links','Geradeaus'],a:1},{q:'"Em frente" heißt:',o:['Geradeaus','Zurück','Rechts'],a:0}]},

 {id:'s3',city:'sal',title:'Gestern, heute, morgen',info:'In Bahia hat man Zeit. Termine sind locker, und "amanhã" ist oft sehr dehnbar.',words:[['hoje','heute'],['amanhã','morgen'],['ontem','gestern'],['Eu vou trabalhar amanhã','Ich werde morgen arbeiten'],['Eu fui ao mercado ontem','Ich war gestern auf dem Markt']],explain:'Zukunft im Alltag: "vou" + Infinitiv, wie "ich gehe arbeiten". Das ist einfacher als die klassische Zukunftsform.',quiz:[{q:'"amanhã" heißt:',o:['gestern','heute','morgen'],a:2},{q:'Wie sagst du "Ich werde essen"?',o:['Eu vou comer','Eu comi','Eu como ontem'],a:0},{q:'"ontem" heißt:',o:['gestern','heute','jetzt'],a:0}]},
 {id:'p1',city:'sao',title:'Slang im Alltag',info:'In São Paulo klingt das Portugiesisch schneller und lockerer. Slang gehört zum Stadtleben.',words:[['E aí?','Was geht?'],['Valeu!','Danke! / Bis dann!'],['Tô cansado','Ich bin fertig'],['Bora!','Los geht\'s!'],['Nossa!','Wow!']],explain:'"Tô" ist die gesprochene Kurzform von "estou". So sagt man es im Alltag, aber nicht in Briefen.',quiz:[{q:'Ein Freund sagt "E aí?". Das bedeutet:',o:['Was geht?','Tschüss','Wie heißt du?'],a:0},{q:'"Bora!" heißt:',o:['Los geht\'s!','Warte!','Nein!'],a:0},{q:'"Tô cansado" heißt:',o:['Ich bin hungrig','Ich bin fertig / müde','Ich bin fröhlich'],a:1}]},

['e aí?','Was geht?','E aí, tudo certo?'],['beleza','alles klar / cool','— Vamos amanhã? — Beleza!'],['tá ligado?','verstehst du?','É tipo assim, tá ligado?'],['valeu','danke / bis dann','Valeu pela ajuda!'],['tranquilo','entspannt / kein Problem','Fica tranquilo, eu resolvo.'],['massa','geil / super','Que massa essa ideia!'],['mano','Alter / Kumpel','Mano, você não vai acreditar!'],['cara','Typ / Alter','Cara, que dia!'],['tô cansado','ich bin fertig','Tô cansado demais hoje.'],['pra caramba','unglaublich viel','Tá quente pra caramba!'],['saudade','Sehnsucht / vermissen','Tô com saudade de você.'],['bora','los geht\'s','Bora tomar um café?'],['nossa!','wow!','Nossa, que lindo!'],['top','super / erstklassig','Essa música é top!'],['maneiro','cool','Que carro maneiro!'],['firmeza','alles klar (locker)','— Firmeza? — Firmeza!'],['demorou','na endlich / abgemacht','Demorou! Vamos nessa.'],['de boa','entspannt / alles gut','Tô de boa, relaxa.'],['relaxa','entspann dich','Relaxa, vai dar certo.'],['pô','Mensch! (Ausruf)','Pô, de novo isso?'],['caramba','Mensch! / Wahnsinn!','Caramba, que susto!'],['gente','Leute (auch als Anrede)','Gente, olha isso!'],['é nois','wir halten zusammen','É nois, sempre!'],['bagunça','Chaos / Durcheinander','Que bagunça essa sala!'],['chato','nervig / langweilig','Que filme chato.'],['legal','nett / cool','Ele é muito legal.'],['perrengue','schwierige Situation','Passei um perrengue.'],['rolê','Unternehmung','Vamos dar um rolê?'],['balada','Party / Club','Hoje tem balada.'],['galera','die Leute / die Clique','A galera chegou.'],['vacilo','Fehler / Patzer','Foi vacilo meu.'],['paia','nervig / schlecht (Nordosten)','Que situação paia.'],['tipo','so was wie / quasi','É tipo um café.'],['sei lá','weiß ich nicht','Sei lá, talvez.'],['né?','oder? / nicht wahr?','Hoje tá quente, né?'],['uai','Mensch! (Minas Gerais)','Uai, e agora?'],['ótimo','ausgezeichnet','Ótimo, obrigado!'],['bacana','toll / prima','Que lugar bacana!'],['fala, mano!','Hey, Alter!','Fala, mano, tudo certo?'],['é isso aí','genau so / richtig','É isso aí, parabéns!'],['tamo junto','ich bin für dich da','Pode contar, tamo junto.']
];

// ===== SPEICHER =====
let S=JSON.parse(localStorage.getItem('pt3')||'{}');
S.done=S.done||{};S.xp=S.xp||0;S.streak=S.streak||0;S.last=S.last||'';S.placed=S.placed||false;S.hard=S.hard||{};S.known=S.known||{};
function save(){localStorage.setItem('pt3',JSON.stringify(S));}
function level(){return Math.floor(S.xp/100)+1;}
function today(){return new Date().toISOString().slice(0,10);}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

// ===== SOUND UND SPRACHE =====
let AC;
function tone(f,d,when){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.25,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+d);}
function ctx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();}
function sndOk(){try{ctx();tone(523,.15,0);tone(659,.15,.12);tone(784,.3,.24);}catch(e){}}
function sndWin(){try{ctx();[523,659,784,1047].forEach((f,i)=>tone(f,.35,i*.14));}catch(e){}}
function sndNo(){try{ctx();tone(220,.25,0);}catch(e){}}
function say(t){try{const u=new SpeechSynthesisUtterance(String(t).replace(/\(.*?\)/g,'').replace(/^— /,''));u.lang='pt-BR';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

// ===== KOPFLEISTE =====
function updateTop(){
 document.getElementById('lvl').textContent='Level '+level();
 document.getElementById('xp').textContent=S.xp+' XP';
 document.getElementById('streak').textContent='🔥 '+S.streak;
 document.getElementById('barfill').style.width=(S.xp%100)+'%';
}
function addXP(n){
 const old=level();S.xp+=n;
 const t=today();
 if(S.last!==t){S.streak=(S.last===yesterday())?S.streak+1:1;S.last=t;}
 save();updateTop();return level()>old;
}

// ===== HAUPTMENÜ =====
function menu(){
 updateTop();window.scrollTo(0,0);
 let h=`<div class="hero" style="${bgPhoto('rio')}"><div class="shade"></div><div class="txt"><h2>Bem-vindo, Marc!</h2><p>Was möchtest du heute lernen?</p><div class="credit">Foto: Wikimedia Commons</div></div></div>`;
 if(!S.placed){h+=`<div class="card center"><div class="big">👋</div><h3>Schon Grundlagen?</h3><p>Der Einstufungstest dauert zwei Minuten und schlägt dir eine passende Lektion vor.</p><button class="btn blue" onclick="placement()">Einstufungstest</button><button class="btn gray" onclick="S.placed=true;save();menu()">Ohne Test starten</button></div>`;}
 h+=`<div class="menu">
 <div class="mi g1" style="${bgPhoto('rio')}" onclick="journey()"><div class="shade"></div><div class="txt"><b>🗺️ Reise durch Brasilien</b><small>${LESSONS.length} Lektionen</small></div></div>
 <div class="mi g2" style="${bgPhoto('sal')}" onclick="endless('vok')"><div class="shade"></div><div class="txt"><b>📘 Vokabeln</b><small>${VOK.length} Wörter, endlos</small></div></div>
 <div class="mi g3" style="${bgPhoto('cristo')}" onclick="endless('small')"><div class="shade"></div><div class="txt"><b>💬 Smalltalk</b><small>${SMALL.length} Sätze, endlos</small></div></div>
 <div class="mi g4" style="${bgPhoto('sao')}" onclick="endless('slg')"><div class="shade"></div><div class="txt"><b>😎 Slang</b><small>${SLG.length} Ausdrücke, endlos</small></div></div>
 </div>
 <div class="card center"><p class="say">Zum Sprechen üben: ruf Claude im Sprachmodus an und sag "Lass uns Portugiesisch sprechen".</p></div>`;
 document.getElementById('app').innerHTML=h;
}

// ===== REISE: Karte mit Lektionen =====
function journey(){
 updateTop();window.scrollTo(0,0);
 let h=`<button class="btn gray" style="margin:0 0 14px" onclick="menu()">← Hauptmenü</button>`;
 CITIES.forEach(c=>{
  const ls=LESSONS.filter(l=>l.city===c.id),n=ls.filter(l=>S.done[l.id]).length;
  h+=`<div class="hero" style="${bgPhoto(c.ph)}"><div class="shade"></div><div class="txt"><h2>${c.name}</h2><p><b>${c.lvl}</b> · ${c.text}</p><p>${n} von ${ls.length} geschafft</p></div></div><div class="lessons">`;
  ls.forEach(l=>{h+=`<div class="les ${S.done[l.id]?'done':''}" onclick="startLesson('${l.id}')">${S.done[l.id]?'✅ ':''}${l.title}<small>${S.done[l.id]?'Nochmal üben':'Starten'}</small></div>`;});
  h+='</div>';
 });
 document.getElementById('app').innerHTML=h;
}

// ===== LEKTION: Zeigen, Erklären, Üben =====
let cur=null,step=0,wi=0,qi=0,right=0;
function startLesson(id){cur=LESSONS.find(l=>l.id===id);step=0;wi=0;qi=0;right=0;render();}
function render(){
 const app=document.getElementById('app'),c=CITIES.find(x=>x.id===cur.city);window.scrollTo(0,0);
 if(step===0){
  app.innerHTML=`<div class="hero" style="${bgPhoto(c.ph)}"><div class="shade"></div><div class="txt"><h2>${cur.title}</h2><p>${c.name}</p></div></div><div class="card"><div class="step">Zum Ort</div><div class="info">${cur.info}</div><button class="btn" onclick="step=1;render()">Los geht\'s</button><button class="btn gray" onclick="journey()">Zurück zur Karte</button></div>`;
 }else if(step===1){
  const w=cur.words[wi];
  app.innerHTML=`<div class="card center"><div class="step">1 von 3 · Neue Sätze (${wi+1}/${cur.words.length})</div><div class="pt">${w[0]}</div><div class="de">${w[1]}</div><button class="btn blue" onclick="say('${esc(w[0])}')">🔊 Anhören</button><p class="say">Sprich den Satz laut nach, bevor du weitergehst.</p><button class="btn" onclick="nextWord()">${wi<cur.words.length-1?'Weiter':'Weiter zur Erklärung'}</button></div>`;
 }else if(step===2){
  app.innerHTML=`<div class="card"><div class="step">2 von 3 · Warum ist das so?</div><div class="info">${cur.explain}</div>${cur.words.map(w=>`<p><b>${w[0]}</b> – ${w[1]}</p>`).join('')}<button class="btn" onclick="step=3;qi=0;right=0;render()">Jetzt üben</button></div>`;
 }else if(step===3){
  const q=cur.quiz[qi];
  app.innerHTML=`<div class="card"><div class="step">3 von 3 · Üben (${qi+1}/${cur.quiz.length})</div><h3>${q.q}</h3>${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join('')}<div id="fb"></div></div>`;
 }else{finish();}
}
function nextWord(){if(wi<cur.words.length-1){wi++;}else{step=2;}render();}
function pick(i,el){
 const q=cur.quiz[qi];
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');});
 let fb;
 if(i===q.a){right++;sndOk();fb='<div class="fb ok">Richtig! 🎉</div>';}
 else{sndNo();el.classList.add('no');fb=`<div class="fb no">Nicht ganz. Richtig ist: <b>${q.o[q.a]}</b>. ${cur.explain}</div>`;}
 document.getElementById('fb').innerHTML=fb+`<button class="btn" onclick="qi++;if(qi>=cur.quiz.length){step=4;}render()">Weiter</button>`;
}
function finish(){
 const first=!S.done[cur.id];
 const gained=first?50+right*10:right*5;
 S.done[cur.id]=true;
 const up=addXP(gained);sndWin();
 document.getElementById('app').innerHTML=`<div class="card center"><div class="big">${up?'🌟':'🎉'}</div><h2>${up?'Level '+level()+' erreicht!':'Lektion geschafft!'}</h2><p>${right} von ${cur.quiz.length} richtig · <b>+${gained} XP</b></p><p class="say">Tagesserie: 🔥 ${S.streak}</p><button class="btn" onclick="journey()">Zurück zur Karte</button><button class="btn gray" onclick="startLesson('${cur.id}')">Lektion wiederholen</button></div>`;
}

// ===== ENDLOS-MODUS =====
const MODES={
 vok:{name:'Vokabeln',emoji:'📘',data:VOK,photo:'sal'},
 small:{name:'Smalltalk',emoji:'💬',data:SMALL,photo:'cristo'},
 slg:{name:'Slang',emoji:'😎',data:SLG,photo:'sao'}
};
let mode=null,ei=0,shown=false,count=0;
function key(m,i){return m+i;}
function pickNext(){
 const d=MODES[mode].data;
 // 40% schwierige Karten wiederholen, sonst neue oder zufällige
 const hard=d.map((_,i)=>i).filter(i=>S.hard[key(mode,i)]);
 const fresh=d.map((_,i)=>i).filter(i=>!S.known[key(mode,i)]&&!S.hard[key(mode,i)]);
 let pool;
 if(hard.length&&Math.random()<.4)pool=hard;
 else if(fresh.length)pool=fresh;
 else pool=d.map((_,i)=>i);
 let n;do{n=pool[Math.floor(Math.random()*pool.length)];}while(pool.length>1&&n===ei);
 return n;
}
function endless(m){mode=m;count=0;ei=-1;ei=pickNext();shown=false;showCard();}
function showCard(){
 updateTop();window.scrollTo(0,0);
 const M=MODES[mode],c=M.data[ei];
 const learned=Object.keys(S.known).filter(k=>k.startsWith(mode)).length;
 let h=`<button class="btn gray" style="margin:0 0 14px" onclick="menu()">← Hauptmenü</button><div class="hero" style="${bgPhoto(M.photo)};min-height:110px"><div class="shade"></div><div class="txt" style="min-height:110px"><h2>${M.emoji} ${M.name}</h2><p>Gekonnt: ${learned} von ${M.data.length} · Heute: ${count}</p></div></div>`;
 h+=`<div class="card center"><div class="pt">${c[0]}</div><button class="btn blue" onclick="say('${esc(mode==='slg'&&c[2]?c[2]:c[0])}')">🔊 Anhören</button>`;
 if(!shown){h+=`<button class="btn" onclick="shown=true;showCard()">Bedeutung zeigen</button>`;}
 else{
  h+=`<div class="info" style="text-align:left"><b>${c[1]}</b>${c[2]?'<br><i>'+c[2]+'</i>':''}</div><div class="row"><button class="btn red" onclick="rateCard(false)">Muss ich üben</button><button class="btn" onclick="rateCard(true)">Kannte ich</button></div>`;
 }
 h+='</div>';
 document.getElementById('app').innerHTML=h;
}
function rateCard(ok){
 const k=key(mode,ei);
 if(ok){S.known[k]=1;delete S.hard[k];sndOk();}else{S.hard[k]=1;delete S.known[k];sndNo();}
 count++;
 if(count%10===0){const up=addXP(20);sndWin();}else{save();}
 ei=pickNext();shown=false;showCard();
}

// ===== EINSTUFUNGSTEST =====
const PLACE=[
 {q:'Was bedeutet "Bom dia"?',o:['Guten Morgen','Gute Nacht','Danke'],a:0},
 {q:'Wie fragst du: "Wie heißt du?"',o:['Como você se chama?','Onde fica?','Quanto custa?'],a:0},
 {q:'"Eu quero um café, por favor" ist:',o:['eine Bestellung','eine Verabschiedung','eine Frage nach dem Weg'],a:0},
 {q:'Was heißt "À direita"?',o:['Links','Rechts','Geradeaus'],a:1},
 {q:'"Eu vou trabalhar amanhã" bedeutet:',o:['Ich habe gearbeitet','Ich werde morgen arbeiten','Ich arbeite nicht'],a:1},
 {q:'Was bedeutet "Eu acho que…"?',o:['Ich finde, dass…','Ich habe…','Ich gehe…'],a:0}
];
let pi=0,pr=0;
function placement(){pi=0;pr=0;placeQ();}
function placeQ(){
 const q=PLACE[pi];
 document.getElementById('app').innerHTML=`<div class="card"><div class="step">Einstufungstest ${pi+1}/${PLACE.length}</div><h3>${q.q}</h3>${q.o.map((o,i)=>`<button class="opt" onclick="placePick(${i})">${o}</button>`).join('')}<button class="btn gray" onclick="placePick(-1)">Weiß ich noch nicht</button></div>`;
}
function placePick(i){
 if(i===PLACE[pi].a)pr++;
 pi++;
 if(pi<PLACE.length){placeQ();return;}
 S.placed=true;save();
 let rec,txt;
 if(pr<=2){rec='r1';txt='Du startest am besten ganz vorne, in Rio mit "Oi! Begrüßen".';}
 else if(pr<=4){rec='r5';txt='Du hast schon Grundlagen. Probier "Am Strand bestellen" in Rio, die früheren Lektionen kannst du zum Auffrischen nachholen.';}
 else{rec='s1';txt='Sehr gut! Du kannst direkt in Salvador mit "Nach dem Weg fragen" weitermachen.';}
 document.getElementById('app').innerHTML=`<div class="card center"><div class="big">🎯</div><h2>${pr} von ${PLACE.length} richtig</h2><p>${txt}</p><button class="btn" onclick="startLesson('${rec}')">Empfohlene Lektion starten</button><button class="btn gray" onclick="menu()">Zum Hauptmenü</button></div>`;
}

menu();
</script>
