<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Português Brasileiro</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eaf6ec;color:#12301c;min-height:100vh}
#top{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#009c3b,#00b348);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#top b{font-size:17px;cursor:pointer}
.pill{background:#ffdf00;color:#12301c;border-radius:20px;padding:4px 10px;font-weight:700;font-size:13px;margin-left:6px}
#barwrap{padding:0 14px 6px;background:#00b348}
#bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
#barfill{height:100%;background:#ffdf00;width:0;transition:width .4s}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;min-height:170px;color:#fff;background:linear-gradient(135deg,#009c3b,#ffdf00 60%,#002776);background-size:cover;background-position:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.65))}
.hero .txt{position:relative;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;min-height:170px}
.hero h2{margin:0 0 4px;font-size:24px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.hero p{margin:0;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.credit{font-size:10px;opacity:.8;margin-top:6px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mi{position:relative;border-radius:18px;overflow:hidden;min-height:130px;color:#fff;cursor:pointer;background-size:cover;background-position:center;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.mi .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.7))}
.mi .txt{position:relative;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:130px}
.mi b{font-size:17px;text-shadow:0 2px 5px rgba(0,0,0,.7)}
.mi small{font-size:12px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.g1{background-color:#009c3b}.g2{background-color:#e07b00}.g3{background-color:#002776}.g4{background-color:#6a1b9a}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.les{background:#fff;border:3px solid #cfe6d4;border-radius:16px;padding:12px;text-align:center;cursor:pointer;font-weight:700;font-size:14px}
.les small{display:block;font-weight:400;color:#4b6a55;margin-top:4px}
.les.done{border-color:#009c3b;background:#e3f6e8}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:#009c3b;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;box-shadow:0 4px 0 #006b2b}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #006b2b}
.btn.blue{background:#002776;box-shadow:0 4px 0 #001549}
.btn.gray{background:#8a9a8e;box-shadow:0 4px 0 #66756a}
.btn.red{background:#c0392b;box-shadow:0 4px 0 #8e2a1f}
.row{display:flex;gap:10px}.row .btn{flex:1}
.pt{font-size:26px;font-weight:800;color:#002776;margin:6px 0}
.de{font-size:17px}
.say{font-size:13px;color:#4b6a55;font-style:italic}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:3px solid #cfe6d4;border-radius:14px;background:#fff;font-size:17px;cursor:pointer}
.opt.ok{border-color:#009c3b;background:#e3f6e8}
.opt.no{border-color:#c0392b;background:#fdecea}
.fb{padding:12px;border-radius:12px;margin-top:10px;font-size:15px}
.fb.ok{background:#e3f6e8;color:#0b5a26}
.fb.no{background:#fdecea;color:#8e2a1f}
.info{background:#fff8cc;border-left:6px solid #ffdf00;padding:12px;border-radius:10px;font-size:14px;margin:10px 0}
.step{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#009c3b;font-weight:800}
.big{font-size:48px;text-align:center}
.center{text-align:center}
.chip{display:inline-block;background:#e3f6e8;color:#0b5a26;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
.photo{height:150px;border-radius:14px;background-size:cover;background-position:center;background-color:#cfe6d4;margin:10px 0}
</style>
</head>
<body>

const LESSONS=[
 {id:'r1',city:'rio',title:'Oi! Begrüßen',info:'Am Strand von Copacabana grüßt man sich mit "Oi!" und einem Lächeln. Brasilianer sind offen und herzlich.',words:[['Oi!','Hallo!'],['Bom dia','Guten Morgen'],['Boa tarde','Guten Tag (nachmittags)'],['Boa noite','Guten Abend / Gute Nacht'],['Tchau!','Tschüss!']],explain:'"Bom" heißt gut und wird bei Tageszeiten verwendet. "Oi" ist das normale Hallo im Alltag.',quiz:[{q:'Wie grüßt du morgens?',o:['Boa noite','Bom dia','Tchau'],a:1},{q:'Was heißt "Oi!"?',o:['Hallo!','Danke!','Bitte!'],a:0},{q:'Du gehst abends nach Hause. Was sagst du?',o:['Boa tarde','Bom dia','Boa noite'],a:2}]},
 {id:'r2',city:'rio',title:'Wie geht\'s?',info:'"Tudo bem?" hörst du in Rio ständig, auch von Fremden an der Strandbar.',words:[['Tudo bem?','Alles gut?'],['Tudo bem!','Ja, alles gut!'],['E você?','Und du?'],['Mais ou menos','Na ja, so lala'],['Beleza','Alles klar / Cool']],explain:'Auf "Tudo bem?" antwortest du meist mit "Tudo bem!" und fragst direkt zurück: "E você?".',quiz:[{q:'Jemand fragt "Tudo bem?". Was antwortest du?',o:['Tudo bem! E você?','Tchau!','Boa noite'],a:0},{q:'Was bedeutet "Mais ou menos"?',o:['Sehr gut','Na ja, so lala','Bis später'],a:1},{q:'Was heißt "E você?"',o:['Wer bist du?','Und du?','Wo bist du?'],a:1}]},
 {id:'r3',city:'rio',title:'Ich heiße…',info:'Am Zuckerhut lernst du schnell Leute kennen. Vorstellen gehört dazu.',words:[['Eu me chamo Marc','Ich heiße Marc'],['Como você se chama?','Wie heißt du?'],['Prazer!','Freut mich!'],['Eu sou alemão','Ich bin Deutscher'],['Eu moro na Alemanha','Ich wohne in Deutschland']],explain:'"Eu" ist "ich". "Sou" kommt von "ser" und beschreibt, wer du bist. "Moro" heißt "ich wohne".',quiz:[{q:'Wie fragst du nach dem Namen?',o:['Como você se chama?','Tudo bem?','Prazer!'],a:0},{q:'Was sagst du nach dem Vorstellen?',o:['Tchau','Prazer!','Beleza?'],a:1},{q:'"Eu sou alemão" heißt:',o:['Ich spreche Deutsch','Ich bin Deutscher','Ich wohne in Deutschland'],a:1}]},
 {id:'r4',city:'rio',title:'Danke und bitte',info:'In Rio sagt man oft "valeu" im lockeren Gespräch und "obrigado" im höflichen.',words:[['Obrigado','Danke (Mann)'],['Obrigada','Danke (Frau)'],['Por favor','Bitte (beim Bitten)'],['De nada','Gern geschehen'],['Desculpa','Entschuldigung']],explain:'Ein Mann sagt "obrigado", eine Frau "obrigada". Das richtet sich nach dem Sprecher, nicht nach dem Gegenüber.',quiz:[{q:'Du bist ein Mann und sagst danke:',o:['Obrigada','Obrigado','De nada'],a:1},{q:'Jemand sagt "Obrigado". Du antwortest:',o:['De nada','Por favor','Oi'],a:0},{q:'Wie entschuldigst du dich?',o:['Desculpa','Tchau','Prazer'],a:0}]},
 {id:'r5',city:'rio',title:'Am Strand bestellen',info:'An der Copacabana bringen Händler dir Água de coco und Eis direkt an den Liegestuhl.',words:[['Eu quero uma água','Ich möchte ein Wasser'],['Um café, por favor','Einen Kaffee, bitte'],['Quanto custa?','Was kostet das?'],['Aceita cartão?','Nehmen Sie Karte?'],['A conta, por favor','Die Rechnung, bitte']],explain:'"Eu quero" heißt "ich möchte". Mit "por favor" am Ende klingt jede Bestellung höflich.',quiz:[{q:'Wie bestellst du einen Kaffee?',o:['Um café, por favor','Quanto custa?','Boa noite'],a:0},{q:'Du willst den Preis wissen:',o:['A conta?','Quanto custa?','Tudo bem?'],a:1},{q:'"A conta, por favor" heißt:',o:['Die Karte, bitte','Die Rechnung, bitte','Noch ein Wasser, bitte'],a:1}]},
 {id:'r6',city:'rio',title:'Rettungssätze',info:'Niemand erwartet perfektes Portugiesisch. Mit diesen Sätzen kommst du immer weiter.',words:[['Eu não entendo','Ich verstehe nicht'],['Pode repetir?','Kannst du das wiederholen?'],['Fala devagar, por favor','Sprich bitte langsam'],['Eu estou aprendendo','Ich lerne gerade'],['Como se diz…?','Wie sagt man…?']],explain:'"Não" steht direkt vor dem Verb. "Estou aprendendo" heißt wortwörtlich "ich bin am Lernen".',quiz:[{q:'Du hast nichts verstanden:',o:['Pode repetir?','Prazer!','Beleza'],a:0},{q:'Jemand spricht zu schnell:',o:['Fala devagar, por favor','Tchau','De nada'],a:0},{q:'"Eu não entendo" heißt:',o:['Ich weiß es','Ich verstehe nicht','Ich möchte nicht'],a:1}]},
 {id:'s1',city:'sal',title:'Nach dem Weg fragen',info:'In den Gassen des Pelourinho in Salvador verirrt man sich leicht. Fragen ist hier normal und herzlich.',words:[['Onde fica…?','Wo ist…?'],['À direita','Rechts'],['À esquerda','Links'],['Em frente','Geradeaus'],['Fica perto?','Ist es in der Nähe?']],explain:'"Fica" bedeutet hier "liegt" oder "befindet sich" und wird oft für Orte benutzt.',quiz:[{q:'Wie fragst du nach dem Weg?',o:['Onde fica a igreja?','Quanto custa?','Boa noite'],a:0},{q:'"À esquerda" heißt:',o:['Rechts','Links','Geradeaus'],a:1},{q:'"Em frente" heißt:',o:['Geradeaus','Zurück','Rechts'],a:0}]},

 {id:'s3',city:'sal',title:'Gestern, heute, morgen',info:'In Bahia hat man Zeit. Termine sind locker, und "amanhã" ist oft sehr dehnbar.',words:[['hoje','heute'],['amanhã','morgen'],['ontem','gestern'],['Eu vou trabalhar amanhã','Ich werde morgen arbeiten'],['Eu fui ao mercado ontem','Ich war gestern auf dem Markt']],explain:'Zukunft im Alltag: "vou" + Infinitiv, wie "ich gehe arbeiten". Das ist einfacher als die klassische Zukunftsform.',quiz:[{q:'"amanhã" heißt:',o:['gestern','heute','morgen'],a:2},{q:'Wie sagst du "Ich werde essen"?',o:['Eu vou comer','Eu comi','Eu como ontem'],a:0},{q:'"ontem" heißt:',o:['gestern','heute','jetzt'],a:0}]},
 {id:'p1',city:'sao',title:'Slang im Alltag',info:'In São Paulo klingt das Portugiesisch schneller und lockerer. Slang gehört zum Stadtleben.',words:[['E aí?','Was geht?'],['Valeu!','Danke! / Bis dann!'],['Tô cansado','Ich bin fertig'],['Bora!','Los geht\'s!'],['Nossa!','Wow!']],explain:'"Tô" ist die gesprochene Kurzform von "estou". So sagt man es im Alltag, aber nicht in Briefen.',quiz:[{q:'Ein Freund sagt "E aí?". Das bedeutet:',o:['Was geht?','Tschüss','Wie heißt du?'],a:0},{q:'"Bora!" heißt:',o:['Los geht\'s!','Warte!','Nein!'],a:0},{q:'"Tô cansado" heißt:',o:['Ich bin hungrig','Ich bin fertig / müde','Ich bin fröhlich'],a:1}]},
